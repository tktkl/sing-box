name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: bash scripts/prepare-test-assets
      - run: |
          base=$(jq -r --arg d '${{ matrix.distro }}' '.[$d]' tests/docker/images.lock.json)
          docker build --platform linux/${{ matrix.arch }} --build-arg "BASE=$base" -f tests/docker/matrix.Dockerfile -t sb-test .
          docker run --rm --init --platform linux/${{ matrix.arch }} -v "$PWD:/workspace:ro" sb-test bash tests/unit.sh
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test-image PLATFORM=linux/amd64
      - run: make test-e2e
      - run: make test-systemd
      - run: make test-install
      - run: make test-acme-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: .test-output/
          include-hidden-files: true
