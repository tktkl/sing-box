name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tagged version and shell sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          [[ $RELEASE_REF == refs/tags/* ]]
          version=$(cat VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $RELEASE_TAG == "v$version" ]]
          [[ -f docs/RELEASE-v$version.md ]]
          shellcheck -S warning -x bin/sb lib/*.sh install.sh scripts/* tests/*.sh tests/docker/matrix.sh
          for file in bin/sb lib/*.sh install.sh scripts/* tests/*.sh; do bash -n "$file"; done
      - name: Package and verify release artifacts
        run: |
          set -Eeuo pipefail
          bash scripts/package-release
          cd .test-output/releases
          sha256sum -c SHA256SUMS
          version=$(cat ../../VERSION)
          tar -xzf "sb-manager-$version.tar.gz"
          "sb-manager-$version/bin/sb" help
          cmp ../../install.sh install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          version=$(cat VERSION)
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "sb-manager $RELEASE_TAG" --notes-file "docs/RELEASE-v$version.md" \
            ".test-output/releases/sb-manager-$version.tar.gz" \
            ".test-output/releases/sb-manager-$version.tar.gz.sha256" \
            .test-output/releases/install.sh .test-output/releases/SHA256SUMS
      - name: Verify published archive download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          directory=$(mktemp -d)
          trap 'rm -rf -- "$directory"' EXIT
          gh release download "$RELEASE_TAG" --dir "$directory" \
            --pattern 'sb-manager-*.tar.gz' --pattern 'sb-manager-*.tar.gz.sha256' \
            --pattern install.sh --pattern SHA256SUMS
          cd "$directory"
          sha256sum -c SHA256SUMS
